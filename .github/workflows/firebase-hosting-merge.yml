# Originally auto-generated by the Firebase CLI, with a Flutter build
# step added — the CLI's default assumes a Node/npm project and doesn't
# know how to build a Flutter web app before deploying it.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # See the equivalent step in build-android.yml -- ai_config.dart is
      # git-ignored, so it has to be generated here from a repo secret or
      # this build fails on the missing import.
      - name: Write AI config
        run: echo "const geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';" > lib/config/ai_config.dart

      - name: Build web app
        run: flutter build web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TECHALLOCATE }}
          channelId: live
          projectId: techallocate
