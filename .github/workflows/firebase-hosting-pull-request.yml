# Originally auto-generated by the Firebase CLI, with a Flutter build
# step added — same reason as the merge workflow.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      # See the equivalent step in build-android.yml -- ai_config.dart is
      # git-ignored, so it has to be generated here from a repo secret or
      # this build fails on the missing import.
      - name: Write AI config
        run: echo "const geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';" > lib/config/ai_config.dart

      - name: Build web app
        run: flutter build web

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TECHALLOCATE }}
          projectId: techallocate
