<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TechAllocate engineering management system">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS "Add to Home Screen" support. Safari mostly ignores
       manifest.json for this — it reads these directly instead. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TechAllocate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>TechAllocate</title>
  <link rel="manifest" href="manifest.json">

  <!-- Custom in-app PWA install button — hidden by default, shown only
       when the browser actually offers an install prompt and the app
       isn't already running standalone (see the script at the bottom
       of <body> for the logic). -->
  <style>
    #pwa-install-banner {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      z-index: 9999;
      align-items: center;
      gap: 12px;
      background: #0D4783;
      color: #ffffff;
      padding: 10px 12px 10px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
    }
    #pwa-install-button {
      background: #ffffff;
      color: #0D4783;
      border: none;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    #pwa-install-button:disabled {
      opacity: 0.6;
      cursor: default;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <div id="pwa-install-banner">
    <span>Install TechAllocate for quick access</span>
    <button id="pwa-install-button" type="button">Install</button>
  </div>

  <script>
    // Vanilla JS, deliberately kept outside the Flutter/Dart app itself:
    // beforeinstallprompt/appinstalled are plain browser events, and this
    // banner is plain DOM — no need to route it through Dart-JS interop.
    (function () {
      var deferredPrompt = null;
      var banner = document.getElementById('pwa-install-banner');
      var installButton = document.getElementById('pwa-install-button');

      function isStandalone() {
        return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
          || window.navigator.standalone === true; // iOS Safari's own flag
      }

      function hideBanner() {
        banner.style.display = 'none';
      }

      function showBanner() {
        if (isStandalone()) return; // never show once already installed
        banner.style.display = 'flex';
      }

      // If already running as an installed app, this banner should never
      // appear at all, even if the browser somehow still fires the event.
      if (isStandalone()) {
        hideBanner();
      }

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault(); // suppress the browser's own ambient prompt
        deferredPrompt = event;
        showBanner();
      });

      installButton.addEventListener('click', function () {
        if (!deferredPrompt) return;
        installButton.disabled = true;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
          installButton.disabled = false;
          hideBanner();
        });
      });

      window.addEventListener('appinstalled', function () {
        deferredPrompt = null;
        hideBanner();
      });
    })();
  </script>
</body>
</html>
